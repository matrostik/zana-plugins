<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Voice - Oval Capsule with Border</title>
  <style>
    :root {
      --bg: #0f1015;
      --card-bg: #181920;
      --composer-bg: #1e2029;
      --border: #2a2d3d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --pill-bg: #181920;
      --pill-border-idle: rgba(239, 68, 68, 0.35);
      --pill-border-rec: rgba(239, 68, 68, 0.45);
      --pill-glow-rec: rgba(239, 68, 68, 0.18);
      --pill-border-proc: rgba(56, 189, 248, 0.4);
      --pill-border-notice: rgba(34, 197, 94, 0.45);
      --accent-red: #ef4444;
      --accent-cyan: #38bdf8;
      --accent-green: #4ade80;
      --btn-stop-bg: rgba(239, 68, 68, 0.22);
      --btn-stop-border: rgba(239, 68, 68, 0.55);
      --btn-stop-icon: #f87171;
      --btn-cancel-bg: rgba(255, 255, 255, 0.08);
      --btn-cancel-hover: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 32px 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 500;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    /* State Switcher Bar */
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .controls button {
      background: #232530;
      border: 1px solid #323647;
      color: #cbd5e1;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .controls button:hover {
      background: #2e3242;
      color: #fff;
    }
    .controls button.active {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    /* Composer Sandbox */
    .composer-box {
      background: var(--composer-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 28px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .composer-draft {
      min-height: 80px;
      color: #cbd5e1;
      font-size: 14px;
      white-space: pre-wrap;
      outline: none;
      padding-bottom: 12px;
    }
    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #282c3c;
      padding-top: 12px;
      height: 48px;
    }
    .composer-actions-left {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
    }

    /* ============================================================ */
    /* Morphing Oval Capsule Control across all phases              */
    /* ============================================================ */
    .pv-mic {
      display: inline-flex;
      align-items: center;
      height: 36px;
      box-sizing: border-box;
      vertical-align: middle;
      border-radius: 9999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border-idle);
      transition: width 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease,
                  box-shadow 0.25s ease,
                  background 0.25s ease,
                  padding 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      position: relative;
    }

    /* 1. Idle: Oval Capsule with Red Border containing only mic icon */
    .pv-mic.pv-phase-idle {
      width: 58px;
      height: 36px;
      border-radius: 9999px;
      border: 1px solid var(--pill-border-idle);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.12);
      padding: 0;
      justify-content: center;
      cursor: pointer;
    }
    .pv-mic.pv-phase-idle:hover {
      background: #20222c;
      border-color: rgba(239, 68, 68, 0.75);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.28);
      transform: scale(1.04);
    }
    .pv-mic.pv-phase-idle:active {
      transform: scale(0.97);
    }

    .pv-mic-button.pv-idle-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      background: transparent;
      border: none;
      box-shadow: none;
      color: #cbd5e1;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s ease;
    }
    .pv-mic.pv-phase-idle:hover .pv-idle-icon {
      color: #ffffff;
    }

    /* 2. Starting */
    .pv-mic.pv-phase-starting {
      width: auto;
      border-color: rgba(234, 179, 8, 0.45);
      box-shadow: 0 0 14px rgba(234, 179, 8, 0.15);
      padding: 0 4px 0 10px;
      gap: 10px;
    }

    /* 3. Recording / Listening: Capsule expands with red glow */
    .pv-mic.pv-phase-recording {
      width: auto;
      border-color: var(--pill-border-rec);
      box-shadow: 0 0 16px var(--pill-glow-rec), 0 4px 16px rgba(0,0,0,0.4);
      padding: 0 4px 0 10px;
      gap: 10px;
    }

    /* 4. Processing */
    .pv-mic.pv-phase-processing {
      width: auto;
      border-color: var(--pill-border-proc);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.15);
      padding: 0 6px 0 10px;
      gap: 10px;
    }

    /* 5. Notice: same oval control showing completion */
    .pv-mic.pv-has-notice {
      width: auto;
      border-color: var(--pill-border-notice);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.15);
      padding: 0 14px 0 12px;
      gap: 8px;
      cursor: pointer;
    }
    .pv-mic.pv-has-notice:hover {
      border-color: rgba(34, 197, 94, 0.75);
      background: rgba(34, 197, 94, 0.08);
    }
    .pv-notice-icon {
      color: var(--accent-green);
      font-weight: 700;
      font-size: 13px;
    }

    /* Active Details */
    .pv-pill-timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 9999px;
      padding: 2px 8px 2px 6px;
    }
    .pv-pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red);
      animation: pv-pulse-dot 1.4s ease-in-out infinite;
    }
    @keyframes pv-pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .pv-pill-timer-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 0.02em;
    }

    .pv-pill-center {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .pv-pill-waveform {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 16px;
    }
    .pv-pill-waveform-bar {
      width: 3px;
      background: var(--accent-cyan);
      border-radius: 9999px;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
      transition: height 0.08s ease;
      min-height: 3px;
      height: 5px;
    }
    .pv-pill-waveform.animated .pv-pill-waveform-bar:nth-child(1) { animation: pv-wave 0.8s ease-in-out infinite alternate; }
    .pv-pill-waveform.animated .pv-pill-waveform-bar:nth-child(2) { animation: pv-wave 0.6s ease-in-out infinite alternate 0.15s; }
    .pv-pill-waveform.animated .pv-pill-waveform-bar:nth-child(3) { animation: pv-wave 0.7s ease-in-out infinite alternate 0.3s; }
    .pv-pill-waveform.animated .pv-pill-waveform-bar:nth-child(4) { animation: pv-wave 0.5s ease-in-out infinite alternate 0.2s; }
    .pv-pill-waveform.animated .pv-pill-waveform-bar:nth-child(5) { animation: pv-wave 0.9s ease-in-out infinite alternate 0.05s; }
    @keyframes pv-wave {
      0% { height: 4px; }
      100% { height: 14px; }
    }

    .pv-pill-status {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
    }

    .pv-pill-btn-stop {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--btn-stop-bg);
      border: 1px solid var(--btn-stop-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--btn-stop-icon);
      padding: 0;
      transition: all 0.15s ease;
    }
    .pv-pill-btn-stop:hover {
      background: rgba(239, 68, 68, 0.38);
      border-color: rgba(239, 68, 68, 0.8);
      color: #fff;
      transform: scale(1.05);
    }

    .pv-pill-btn-cancel {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--btn-cancel-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #94a3b8;
      padding: 0;
      transition: all 0.15s ease;
    }
    .pv-pill-btn-cancel:hover {
      background: var(--btn-cancel-hover);
      color: #f1f5f9;
      transform: scale(1.05);
    }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Prompt Voice: Morphing Oval Pill <span class="badge">Preview</span></h1>
    <p class="subtitle">Oval capsule border with signature crimson glow in idle (strictly icon only), fluidly expanding to listening.</p>
  </header>

  <!-- Interactive State Controls -->
  <div class="controls">
    <button data-state="idle" class="active">1. Idle (Oval Capsule with Border) [🎙]</button>
    <button data-state="recording">2. Listening (Expanded Capsule)</button>
    <button data-state="processing">3. Processing (Expanded Capsule)</button>
    <button data-state="notice">4. Notice: "Added to draft."</button>
  </div>

  <!-- Interactive Composer Sandbox -->
  <div class="composer-box">
    <div class="composer-draft" id="draftText">Click the oval capsule button below to test the morphing animation:</div>
    <div class="composer-toolbar">
      <div class="composer-actions-left" id="composerContainer">
        <!-- Injected dynamically based on active state -->
      </div>
      <div style="color: #64748b; font-size: 12px;">Morphing Oval Capsule</div>
    </div>
  </div>
</div>

<script>
  let currentState = 'idle';
  let timerInterval = null;
  let noticeTimeout = null;
  let seconds = 2;

  const container = document.getElementById('composerContainer');
  const draft = document.getElementById('draftText');

  function renderState() {
    clearInterval(timerInterval);
    clearTimeout(noticeTimeout);

    if (currentState === 'idle') {
      container.innerHTML = `
        <div class="pv-mic pv-phase-idle" id="idleBtn" title="Start dictation">
          <button class="pv-idle-icon" aria-label="Dictation">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a7 7 0 0 0 14 0h-2a5 5 0 0 1-10 0H5Zm6 9h2v-3h-2v3Z"/>
            </svg>
          </button>
        </div>
      `;
      document.getElementById('idleBtn').onclick = () => setState('recording');
      return;
    }

    if (currentState === 'recording') {
      seconds = 2;
      container.innerHTML = `
        <div class="pv-mic pv-phase-recording">
          <div class="pv-pill-timer-badge">
            <div class="pv-pill-dot"></div>
            <span class="pv-pill-timer-text" id="timeDisplay">0:02</span>
          </div>
          <div class="pv-pill-center">
            <div class="pv-pill-waveform animated">
              <span class="pv-pill-waveform-bar"></span>
              <span class="pv-pill-waveform-bar"></span>
              <span class="pv-pill-waveform-bar"></span>
              <span class="pv-pill-waveform-bar"></span>
              <span class="pv-pill-waveform-bar"></span>
            </div>
            <span class="pv-pill-status">Listening...</span>
          </div>
          <button class="pv-pill-btn-stop" id="stopBtn" title="Stop dictation" aria-label="Stop dictation">
            <svg viewBox="0 0 24 24" width="12" height="12"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
          </button>
          <button class="pv-pill-btn-cancel" id="cancelBtn" title="Cancel recording" aria-label="Cancel recording">
            <svg viewBox="0 0 24 24" width="12" height="12"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      `;
      timerInterval = setInterval(() => {
        seconds++;
        const mins = Math.floor(seconds / 60);
        const secs = String(seconds % 60).padStart(2, '0');
        const display = document.getElementById('timeDisplay');
        if (display) display.textContent = `${mins}:${secs}`;
      }, 1000);

      document.getElementById('stopBtn').onclick = () => setState('processing');
      document.getElementById('cancelBtn').onclick = () => setState('idle');
      return;
    }

    if (currentState === 'processing') {
      container.innerHTML = `
        <div class="pv-mic pv-phase-processing">
          <div class="pv-pill-timer-badge">
            <span class="pv-pill-timer-text">0:${String(seconds).padStart(2, '0')}</span>
          </div>
          <div class="pv-pill-center">
            <div class="spinner"></div>
            <span class="pv-pill-status">Transcribing and refining…</span>
          </div>
        </div>
      `;
      setTimeout(() => {
        if (currentState === 'processing') {
          draft.textContent += ' dictation complete!';
          setState('notice');
        }
      }, 1200);
      return;
    }

    if (currentState === 'notice') {
      container.innerHTML = `
        <div class="pv-mic pv-has-notice" id="noticeOval" title="Click to dismiss">
          <span class="pv-notice-icon">✓</span>
          <span class="pv-pill-status">Added to draft.</span>
        </div>
      `;
      document.getElementById('noticeOval').onclick = () => setState('idle');

      noticeTimeout = setTimeout(() => {
        if (currentState === 'notice') {
          setState('idle');
        }
      }, 4000);
      return;
    }
  }

  function setState(state) {
    currentState = state;
    document.querySelectorAll('.controls button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.state === state);
    });
    renderState();
  }

  document.querySelectorAll('.controls button').forEach(btn => {
    btn.onclick = () => setState(btn.dataset.state);
  });

  renderState();
</script>
</body>
</html>
