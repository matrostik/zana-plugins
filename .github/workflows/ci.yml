name: CI

# Gate pull requests before merging into master.
# Verifies marketplace feed integrity and ensures all plugin manifests
# and committed bundle artifacts are present and well-formed.

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Marketplace Feed Check
        run: node marketplace/check-feed.mjs

      - name: Plugin Manifests & Bundles Check
        run: node scripts/check-plugins.mjs
