name: CI

# Gate pull requests before merging into master.
# Enforces:
# 1. Marketplace feed integrity and plugin manifest validation
# 2. Plugin tests with >=80% coverage threshold enforcement
# 3. Bundle parity check (source code matches committed server.mjs / app.js)
# 4. Secret & credential scanning

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feed-and-manifests:
    name: Marketplace Feed & Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Marketplace Feed Check
        run: node marketplace/check-feed.mjs

      - name: Plugin Manifests & Bundles Check
        run: node scripts/check-plugins.mjs

  plugin-tests-coverage:
    name: Plugin Builds & Coverage Floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout Zana SDK (types and test harness)
        uses: actions/checkout@v4
        with:
          repository: salesforce/zana
          ref: bb2cb0b6201dd409fbf73dd11bf7096df5dacf93
          path: .zana-sdk
          sparse-checkout: |
            packages/plugin-sdk
            packages/agent-process-utils
            packages/domain
            packages/host-daemon-contract
            packages/provider-bridge-acp
            packages/provider-bridge-protocol
            packages/server-contract
            packages/hono-typed-routes
            packages/tsconfig

      - name: Install locked verification tools and build SDK
        run: |
          npm ci
          npm run prepare:sdk
          npm run test:ci

      - name: Run Plugin Tests, Coverage & Bundle Drift Check
        env:
          CI_BASE_REF: ${{ github.base_ref || 'master' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run verify:plugins

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-coverage-reports
          path: plugins/*/coverage/
          if-no-files-found: ignore

  security:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    needs: [feed-and-manifests, plugin-tests-coverage, security]
    if: always()
    steps:
      - name: Require All CI Checks to Pass
        env:
          FEED_RESULT: ${{ needs.feed-and-manifests.result }}
          TESTS_RESULT: ${{ needs.plugin-tests-coverage.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          echo "Feed & Manifests: $FEED_RESULT"
          echo "Plugin Tests & Coverage: $TESTS_RESULT"
          echo "Security Scan: $SECURITY_RESULT"
          test "$FEED_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
